<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d1a">
<title>لوحة التحكم — Your Local Market</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://inndhzupjwyaqafrnucb.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlubmRoenVwand5YXFhZnJudWNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxODcxODcsImV4cCI6MjA4ODc2MzE4N30.S2GI2HmbFVaYxfEXrSW32XX35QKMZiEj2jS6umJEvq4';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const ADMIN_PASSWORD = 'admin2025';
  const LATE_DAYS = { regular: 30, occasional: 7 };

  function money(n) { return Math.abs(n).toLocaleString('fr-DZ'); }
  function fdate(s) {
    if (!s) return '';
    return new Date(s).toLocaleDateString('ar-DZ', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function bal(c) {
    return (c.transactions || []).reduce((s, t) => t.type === 'debt' ? s + t.amount : s - t.amount, 0);
  }
  function genCode() {
    const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    const nums = '0123456789';
    let l = '', n = '';
    for (let i = 0; i < 2; i++) l += letters[Math.floor(Math.random() * letters.length)];
    for (let i = 0; i < 4; i++) n += nums[Math.floor(Math.random() * nums.length)];
    return 'ZB-' + l + n;
  }
  function lastDebtDate(c) {
    const debts = (c.transactions || []).filter(t => t.type === 'debt');
    if (!debts.length) return null;
    return new Date(Math.max(...debts.map(t => new Date(t.date))));
  }
  function isLate(c) {
    if (bal(c) <= 0) return false;
    const ld = lastDebtDate(c);
    if (!ld) return false;
    const days = Math.floor((Date.now() - ld.getTime()) / 86400000);
    const limit = c.customer_type === 'regular' ? LATE_DAYS.regular : LATE_DAYS.occasional;
    return days > limit;
  }
  function lateDays(c) {
    if (bal(c) <= 0) return 0;
    const ld = lastDebtDate(c);
    if (!ld) return 0;
    const days = Math.floor((Date.now() - ld.getTime()) / 86400000);
    const limit = c.customer_type === 'regular' ? LATE_DAYS.regular : LATE_DAYS.occasional;
    return Math.max(0, days - limit);
  }

  let allCustomers = [];
  let selectedCustomer = null;
  let currentFilter = 'all';

  window.adminLogin = function () {
    const pw = document.getElementById('pw-inp').value;
    if (pw === ADMIN_PASSWORD) {
      sessionStorage.setItem('admin_auth', '1');
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = 'block';
      loadAll();
    } else {
      document.getElementById('pw-err').style.display = 'block';
    }
  };
  window.adminLogout = function () { sessionStorage.removeItem('admin_auth'); location.reload(); };

  async function loadAll() {
    showLoader(true);
    const { data, error } = await sb.from('customers').select('*').order('name');
    showLoader(false);
    if (error) { showToast('❌ خطأ في تحميل البيانات', 'err'); return; }
    allCustomers = data || [];
    renderStats();
    renderAlertBanner();
    applyFilter(currentFilter);
  }

  function renderStats() {
    const total = allCustomers.length;
    const totalDebt = allCustomers.reduce((s, c) => { const b = bal(c); return b > 0 ? s + b : s; }, 0);
    const lateCount = allCustomers.filter(c => isLate(c)).length;
    const regular = allCustomers.filter(c => c.customer_type === 'regular').length;
    const occasional = allCustomers.filter(c => c.customer_type !== 'regular').length;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-debt').textContent = money(totalDebt) + ' دج';
    document.getElementById('stat-late').textContent = lateCount;
    document.getElementById('stat-regular').textContent = regular;
    document.getElementById('stat-occasional').textContent = occasional;
  }

  function renderAlertBanner() {
    const lateList = allCustomers.filter(c => isLate(c) && bal(c) > 0);
    const banner = document.getElementById('alert-banner');
    if (!lateList.length) { banner.style.display = 'none'; return; }
    banner.style.display = 'block';
    banner.innerHTML = `
      <div class="ab-header">
        <span>⚠️ ${lateList.length} زبون متأخر في السداد</span>
        <button class="ab-btn" onclick="applyFilter('late')">عرضهم</button>
      </div>
      <div class="ab-list">
        ${lateList.map(c => `
          <div class="ab-item" onclick="openCustomer('${c.id}')">
            <span class="ab-name">${c.name}</span>
            <span class="ab-tag ${c.customer_type === 'regular' ? 'regular' : 'occasional'}">${c.customer_type === 'regular' ? '⭐ دائم' : '👤 عارض'}</span>
            <span class="ab-days">تأخر ${lateDays(c)} يوم</span>
            <span class="ab-bal">${money(bal(c))} دج</span>
          </div>`).join('')}
      </div>`;
  }

  window.applyFilter = function (f) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('filter-' + f).classList.add('active');
    let list = [...allCustomers];
    if (f === 'late') list = list.filter(c => isLate(c));
    else if (f === 'regular') list = list.filter(c => c.customer_type === 'regular');
    else if (f === 'occasional') list = list.filter(c => c.customer_type !== 'regular');
    const q = document.getElementById('search-inp').value.trim().toLowerCase();
    if (q) list = list.filter(c => c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q));
    renderList(list);
  };
  window.searchCustomers = function () { applyFilter(currentFilter); };

  function renderList(list) {
    const el = document.getElementById('cust-list');
    if (!list.length) { el.innerHTML = '<div class="empty">لا يوجد زبائن في هذا التصنيف</div>'; return; }
    el.innerHTML = list.map(c => {
      const b = bal(c);
      const late = isLate(c);
      const isReg = c.customer_type === 'regular';
      return `
        <div class="cust-card ${late ? 'late' : ''}" onclick="openCustomer('${c.id}')">
          <div class="cc-avatar ${isReg ? 'reg' : 'occ'}">${c.name.charAt(0)}</div>
          <div class="cc-info">
            <div class="cc-name">${c.name}
              <span class="type-badge ${isReg ? 'regular' : 'occasional'}">${isReg ? '⭐ دائم' : '👤 عارض'}</span>
              ${late ? `<span class="late-badge">⚠️ ${lateDays(c)}ي</span>` : ''}
            </div>
            <div class="cc-code">${c.code}</div>
          </div>
          <div class="cc-bal ${b > 0 ? 'debt' : b < 0 ? 'credit' : 'zero'}">
            <div class="cc-amt">${money(b)}</div>
            <div class="cc-tag">${b > 0 ? 'دين' : b < 0 ? 'رصيد' : 'صافي'}</div>
          </div>
        </div>`;
    }).join('');
  }

  window.showAddModal = function () {
    document.getElementById('add-modal').style.display = 'flex';
    document.getElementById('new-code').value = genCode();
    document.getElementById('new-name').value = '';
    document.getElementById('new-phone').value = '';
    document.getElementById('new-type').value = 'occasional';
  };
  window.closeAddModal = function () { document.getElementById('add-modal').style.display = 'none'; };
  window.refreshCode = function () { document.getElementById('new-code').value = genCode(); };
  window.saveNewCustomer = async function () {
    const name = document.getElementById('new-name').value.trim();
    const code = document.getElementById('new-code').value.trim().toUpperCase();
    const phone = document.getElementById('new-phone').value.trim();
    const customer_type = document.getElementById('new-type').value;
    if (!name || !code) { showToast('❌ أدخل الاسم والكود', 'err'); return; }
    showLoader(true);
    const { error } = await sb.from('customers').insert({ name, code, phone, customer_type, transactions: [] });
    showLoader(false);
    if (error) { showToast(error.code === '23505' ? '❌ الكود مستخدم' : '❌ خطأ: ' + error.message, 'err'); return; }
    closeAddModal();
    showToast('✅ تم إضافة الزبون');
    await loadAll();
  };

  window.openCustomer = function (id) {
    selectedCustomer = allCustomers.find(c => c.id === id);
    if (!selectedCustomer) return;
    renderCustomerModal(selectedCustomer);
    document.getElementById('cust-modal').style.display = 'flex';
  };
  window.closeCustomerModal = function () {
    document.getElementById('cust-modal').style.display = 'none';
    selectedCustomer = null;
  };

  function renderCustomerModal(c) {
    const b = bal(c);
    const late = isLate(c);
    const isReg = c.customer_type === 'regular';
    document.getElementById('cm-avatar').textContent = c.name.charAt(0);
    document.getElementById('cm-name').textContent = c.name;
    document.getElementById('cm-code').textContent = c.code;
    document.getElementById('cm-bal').textContent = money(b);
    document.getElementById('cm-bal').style.color = b > 0 ? '#ff6b6b' : '#51cf66';
    document.getElementById('cm-lbl').textContent = b > 0 ? '💸 دين' : b < 0 ? '✅ رصيد لصالحه' : '✅ صافي';
    document.getElementById('cm-type-sel').value = c.customer_type || 'occasional';
    const lateEl = document.getElementById('cm-late-alert');
    if (late) {
      lateEl.style.display = 'block';
      lateEl.textContent = `⚠️ متأخر في السداد منذ ${lateDays(c)} يوم (الحد المسموح: ${isReg ? '30' : '7'} أيام)`;
    } else { lateEl.style.display = 'none'; }
    const txns = [...(c.transactions || [])].reverse();
    document.getElementById('cm-history').innerHTML = !txns.length
      ? '<div class="no-txn">لا توجد معاملات</div>'
      : txns.map((t, i) => `
        <div class="txn-item">
          <div class="txn-dot ${t.type}"></div>
          <div class="txn-info">
            <div class="txn-desc">${t.desc}</div>
            <div class="txn-date">${fdate(t.date)}</div>
          </div>
          <div class="txn-amt ${t.type}">${t.type === 'debt' ? '+' : '-'} ${money(t.amount)} دج</div>
          <button class="btn-del-txn" onclick="deleteTxn(${txns.length - 1 - i})">🗑</button>
        </div>`).join('');
    document.getElementById('txn-desc').value = '';
    document.getElementById('txn-amount').value = '';
    document.getElementById('txn-type').value = 'debt';
  }

  window.changeCustomerType = async function () {
    if (!selectedCustomer) return;
    const newType = document.getElementById('cm-type-sel').value;
    showLoader(true);
    const { data, error } = await sb.from('customers').update({ customer_type: newType }).eq('id', selectedCustomer.id).select().single();
    showLoader(false);
    if (error) { showToast('❌ خطأ', 'err'); return; }
    selectedCustomer = data;
    const idx = allCustomers.findIndex(c => c.id === data.id);
    if (idx !== -1) allCustomers[idx] = data;
    renderCustomerModal(data);
    renderStats();
    renderAlertBanner();
    applyFilter(currentFilter);
    showToast('✅ تم تغيير نوع الزبون');
  };

  window.addTransaction = async function () {
    if (!selectedCustomer) return;
    const desc = document.getElementById('txn-desc').value.trim();
    const amount = parseFloat(document.getElementById('txn-amount').value);
    const type = document.getElementById('txn-type').value;
    if (!desc || !amount || amount <= 0) { showToast('❌ أدخل الوصف والمبلغ', 'err'); return; }
    const updatedTxns = [...(selectedCustomer.transactions || []), { type, amount, desc, date: new Date().toISOString() }];
    showLoader(true);
    const { data, error } = await sb.from('customers').update({ transactions: updatedTxns }).eq('id', selectedCustomer.id).select().single();
    showLoader(false);
    if (error) { showToast('❌ خطأ في الحفظ', 'err'); return; }
    selectedCustomer = data;
    const idx = allCustomers.findIndex(c => c.id === data.id);
    if (idx !== -1) allCustomers[idx] = data;
    renderCustomerModal(data); renderStats(); renderAlertBanner(); applyFilter(currentFilter);
    showToast(type === 'debt' ? '✅ تم تسجيل الدين' : '✅ تم تسجيل الدفعة');
  };

  window.deleteTxn = async function (realIndex) {
    if (!selectedCustomer || !confirm('هل تريد حذف هذه المعاملة؟')) return;
    const updatedTxns = [...(selectedCustomer.transactions || [])];
    updatedTxns.splice(realIndex, 1);
    showLoader(true);
    const { data, error } = await sb.from('customers').update({ transactions: updatedTxns }).eq('id', selectedCustomer.id).select().single();
    showLoader(false);
    if (error) { showToast('❌ خطأ في الحذف', 'err'); return; }
    selectedCustomer = data;
    const idx = allCustomers.findIndex(c => c.id === data.id);
    if (idx !== -1) allCustomers[idx] = data;
    renderCustomerModal(data); renderStats(); renderAlertBanner(); applyFilter(currentFilter);
    showToast('🗑 تم حذف المعاملة');
  };

  window.deleteCustomer = async function () {
    if (!selectedCustomer || !confirm(`حذف زبون "${selectedCustomer.name}" نهائياً؟`)) return;
    showLoader(true);
    const { error } = await sb.from('customers').delete().eq('id', selectedCustomer.id);
    showLoader(false);
    if (error) { showToast('❌ خطأ في الحذف', 'err'); return; }
    closeCustomerModal();
    showToast('🗑 تم حذف الزبون');
    await loadAll();
  };

  window.copyCustomerLink = function () {
    if (!selectedCustomer) return;
    const text = `كودك في Your Local Market:\n${selectedCustomer.code}\n\nتابع حسابك:\n${location.origin}/index.html`;
    navigator.clipboard.writeText(text).then(() => showToast('📋 تم نسخ الكود'));
  };

  function showLoader(s) { document.getElementById('loader').style.display = s ? 'flex' : 'none'; }
  function showToast(msg, type = 'ok') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show ' + type;
    setTimeout(() => t.className = 'toast', 2800);
  }

  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('pw-inp').addEventListener('keydown', e => { if (e.key === 'Enter') adminLogin(); });
    if (sessionStorage.getItem('admin_auth') === '1') {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = 'block';
      loadAll();
    }
  });
</script>

.late-badge { font-size:10px; padding:2px 7px; border-radius:5px; background:rgba(255,165,0,0.2); color:#ffb347; font-weight:700; }
.cc-bal { text-align:left; flex-shrink:0; }
.cc-amt { font-size:14px; font-weight:900; direction:ltr; }
.cc-tag { font-size:10px; margin-top:2px; text-align:center; }
.cc-bal.debt .cc-amt,.cc-bal.debt .cc-tag { color:#ff6b6b; }

.empty { color:rgba(255,255,255,0.3); text-align:center; padding:40px; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(8px); z-index:200; align-items:flex-end; justify-content:center; }
.modal-box { background:#14142a; border:1px solid rgba(255,255,255,0.1); border-radius:28px 28px 0 0; padding:24px 20px 34px; width:100%; max-width:540px; max-height:92vh; overflow-y:auto; }
.modal-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.modal-t { font-size:17px; font-weight:900; }
.btn-close { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.5); width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:16px; }
.form-row { margin-bottom:13px; }
.form-lbl { font-size:12px; color:rgba(255,255,255,0.5); margin-bottom:6px; display:block; font-weight:700; }
.form-inp { width:100%; padding:13px 15px; background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.1); border-radius:12px; color:white; font-family:'Cairo',sans-serif; font-size:15px; outline:none; transition:all 0.2s; }
.form-inp:focus { border-color:#7c6ff7; }
.form-inp option { background:#14142a; }
.code-wrap { display:flex; gap:8px; }
.code-wrap .form-inp { flex:1; text-align:center; letter-spacing:3px; font-weight:900; font-size:17px; }
.btn-refresh { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1); color:white; padding:13px 15px; border-radius:12px; cursor:pointer; font-size:18px; flex-shrink:0; }
.btn-save { width:100%; padding:14px; background:linear-gradient(135deg,#5a4fcf,#7c6ff7); color:white; border:none; border-radius:13px; font-family:'Cairo',sans-serif; font-size:15px; font-weight:800; cursor:pointer; margin-top:6px; }
.cm-top { text-align:center; margin-bottom:16px; }
.cm-avatar { width:64px; height:64px; background:linear-gradient(135deg,#5a4fcf,#7c6ff7); border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:900; margin:0 auto 10px; }
.cm-name { font-size:19px; font-weight:900; }
.cm-code-badge { display:inline-block; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1); padding:4px 13px; border-radius:20px; font-size:12px; font-family:monospace; letter-spacing:2px; margin-top:5px; color:rgba(255,255,255,0.5); }
.cm-bal-box { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:16px; text-align:center; margin-bottom:13px; }
.cm-bal-num { font-size:38px; font-weight:900; direction:ltr; }
.cm-bal-cur { color:rgba(255,255,255,0.4); font-size:12px; margin-top:3px; }
#cm-lbl { font-size:13px; margin-top:4px; }
#cm-late-alert { display:none; background:rgba(255,165,0,0.1); border:1px solid rgba(255,165,0,0.3); color:#ffb347; padding:10px 14px; border-radius:10px; font-size:12px; font-weight:700; margin-bottom:12px; text-align:center; }
.type-row { display:flex; align-items:center; gap:10px; margin-bottom:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:12px 14px; }
.type-row-lbl { flex:1; font-size:13px; font-weight:700; color:rgba(255,255,255,0.6); }
.type-row select { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); color:white; padding:7px 10px; border-radius:9px; font-family:'Cairo',sans-serif; font-size:12px; outline:none; cursor:pointer; }
.type-row select option { background:#14142a; }
.btn-type-save { background:rgba(124,111,247,0.2); border:1px solid rgba(124,111,247,0.4); color:#a89ff7; padding:7px 12px; border-radius:9px; font-family:'Cairo',sans-serif; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
.section-t { font-size:12px; font-weight:800; color:rgba(255,255,255,0.4); margin-bottom:9px; margin-top:16px; letter-spacing:0.5px; }
.txn-form { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:13px; margin-bottom:13px; }
.txn-row { display:flex; gap:8px; margin-bottom:8px; }
.txn-row .form-inp { flex:1; padding:11px 12px; font-size:14px; }
.btn-add-txn { width:100%; padding:11px; background:linear-gradient(135deg,#1a7a4a,#22a865); color:white; border:none; border-radius:11px; font-family:'Cairo',sans-serif; font-size:14px; font-weight:800; cursor:pointer; }
.txn-history { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:13px; overflow:hidden; margin-bottom:13px; }
.txn-item { padding:10px 13px; display:flex; align-items:center; border-bottom:1px solid rgba(255,255,255,0.05); }
.txn-item:last-child { border-bottom:none; }
.txn-dot { width:8px; height:8px; border-radius:50%; margin-left:9px; flex-shrink:0; }
.txn-dot.debt { background:#ff6b6b; }
.txn-dot.payment { background:#51cf66; }
.txn-info { flex:1; }
.txn-desc { font-size:12px; font-weight:600; }
.txn-date { font-size:10px; color:rgba(255,255,255,0.35); }
.txn-amt { font-size:13px; font-weight:900; direction:ltr; margin-left:6px; }
.txn-amt.debt { color:#ff6b6b; }
.txn-amt.payment { color:#51cf66; }
.btn-del-txn { background:rgba(255,107,107,0.1); border:1px solid rgba(255,107,107,0.2); color:#ff6b6b; width:26px; height:26px; border-radius:7px; cursor:pointer; font-size:12px; flex-shrink:0; }
.no-txn { color:rgba(255,255,255,0.3); text-align:center; padding:18px; font-size:12px; }
.cm-actions { display:flex; gap:9px; }
.btn-copy { flex:1; padding:11px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); color:white; border-radius:11px; font-family:'Cairo',sans-serif; font-size:12px; font-weight:700; cursor:pointer; }
.btn-del-cust { padding:11px 16px; background:rgba(255,50,50,0.1); border:1px solid rgba(255,50,50,0.25); color:#ff6b6b; border-radius:11px; font-family:'Cairo',sans-serif; font-size:12px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<div id="loader"><div class="spin"></div></div>
<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-ico">🔐</div>
    <div class="login-t">لوحة التحكم</div>
    <div class="login-s">Your Local Market — للمدير فقط</div>
    <input type="password" id="pw-inp" class="pw-inp" placeholder="كلمة السر">
    <div id="pw-err">❌ كلمة السر غير صحيحة</div>
    <button class="btn-login" onclick="adminLogin()">دخول ←</button>
  </div>
</div>

<!-- ADMIN -->
<div id="admin-screen">
  <div class="topbar">
    <div class="tb-logo">
      <div class="tb-ico">🏪</div>
      <div>
        <div class="tb-title">Your Local Market</div>
        <div class="tb-sub">لوحة التحكم</div>
      </div>
    </div>
    <button class="btn-out" onclick="adminLogout()">خروج ↩</button>
  </div>
  <div class="body">

    <div id="alert-banner"></div>

    <div class="stats">
      <div class="stat-card"><div class="stat-val" id="stat-total">0</div><div class="stat-lbl">كل الزبائن</div></div>
      <div class="stat-card"><div class="stat-val orange" id="stat-late">0</div><div class="stat-lbl">⚠️ متأخرون</div></div>
      <div class="stat-card"><div class="stat-val red" id="stat-debt">0</div><div class="stat-lbl">مجموع الديون</div></div>
      <div class="stat-card"><div class="stat-val" id="stat-regular">0</div><div class="stat-lbl">⭐ دائمون</div></div>
      <div class="stat-card"><div class="stat-val green" id="stat-occasional">0</div><div class="stat-lbl">👤 عارضون</div></div>
    </div>

    <div class="filters">
      <button class="filter-btn active" id="filter-all" onclick="applyFilter('all')">الكل</button>
      <button class="filter-btn" id="filter-late" onclick="applyFilter('late')">⚠️ المتأخرون</button>
      <button class="filter-btn" id="filter-regular" onclick="applyFilter('regular')">⭐ الدائمون</button>
      <button class="filter-btn" id="filter-occasional" onclick="applyFilter('occasional')">👤 العارضون</button>
    </div>

    <div class="actions-bar">
      <div class="search-wrap">
        <span class="search-ico">🔍</span>
        <input type="text" id="search-inp" class="search-inp" placeholder="ابحث بالاسم أو الكود..." oninput="searchCustomers()">
      </div>
      <button class="btn-add" onclick="showAddModal()">+ زبون</button>
    </div>

    <div id="cust-list"><div class="empty">جاري التحميل...</div></div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal" id="add-modal" onclick="if(event.target===this) closeAddModal()">
  <div class="modal-box">
    <div class="modal-hd">
      <div class="modal-t">➕ زبون جديد</div>
      <button class="btn-close" onclick="closeAddModal()">✕</button>
    </div>
    <div class="form-row">
      <label class="form-lbl">👤 اسم الزبون</label>
      <input type="text" id="new-name" class="form-inp" placeholder="مثال: أحمد بن علي">
    </div>
    <div class="form-row">
      <label class="form-lbl">🔑 كود الزبون</label>
      <div class="code-wrap">
        <input type="text" id="new-code" class="form-inp" oninput="this.value=this.value.toUpperCase()">
        <button class="btn-refresh" onclick="refreshCode()">🔄</button>
      </div>
    </div>
    <div class="form-row">
      <label class="form-lbl">📞 رقم الهاتف (اختياري)</label>
      <input type="tel" id="new-phone" class="form-inp" placeholder="0555 000 000">
    </div>
    <div class="form-row">
      <label class="form-lbl">🏷️ نوع الزبون</label>
      <select id="new-type" class="form-inp">
        <option value="occasional">👤 عارض — يُتوقع السداد خلال 7 أيام</option>
        <option value="regular">⭐ دائم — يُتوقع السداد خلال 30 يوم</option>
      </select>
    </div>
    <button class="btn-save" onclick="saveNewCustomer()">حفظ الزبون ✓</button>
  </div>
</div>

<!-- CUSTOMER MODAL -->
<div class="modal" id="cust-modal" onclick="if(event.target===this) closeCustomerModal()">
  <div class="modal-box">
    <div class="modal-hd">
      <div class="modal-t">تفاصيل الزبون</div>
      <button class="btn-close" onclick="closeCustomerModal()">✕</button>
    </div>
    <div class="cm-top">
      <div class="cm-avatar" id="cm-avatar">-</div>
      <div class="cm-name" id="cm-name">-</div>
      <div class="cm-code-badge" id="cm-code">-</div>
    </div>
    <div id="cm-late-alert"></div>
    <div class="cm-bal-box">
      <div class="cm-bal-num" id="cm-bal">0</div>
      <div class="cm-bal-cur">دينار جزائري (دج)</div>
      <div id="cm-lbl"></div>
    </div>
    <div class="type-row">
      <div class="type-row-lbl">🏷️ نوع الزبون</div>
      <select id="cm-type-sel">
        <option value="occasional">👤 عارض (7 أيام)</option>
        <option value="regular">⭐ دائم (30 يوم)</option>
      </select>
      <button class="btn-type-save" onclick="changeCustomerType()">تغيير ✓</button>
    </div>
    <div class="section-t">➕ إضافة معاملة</div>
    <div class="txn-form">
      <div class="txn-row">
        <select id="txn-type" class="form-inp">
          <option value="debt">💸 دين</option>
          <option value="payment">✅ دفعة</option>
        </select>
        <input type="number" id="txn-amount" class="form-inp" placeholder="المبلغ (دج)" min="1">
      </div>
      <input type="text" id="txn-desc" class="form-inp" placeholder="الوصف..." style="margin-bottom:9px;">
      <button class="btn-add-txn" onclick="addTransaction()">تسجيل ✓</button>
    </div>
    <div class="section-t">📜 سجل المعاملات</div>
    <div class="txn-history" id="cm-history"></div>
    <div class="cm-actions">
      <button class="btn-copy" onclick="copyCustomerLink()">📋 نسخ كود الزبون</button>
      <button class="btn-del-cust" onclick="deleteCustomer()">🗑 حذف</button>
    </div>
  </div>
</div>
</body>
</html>
